name: CodeQL

on:
  # Dispatch only until code scanning is enabled for this private repository.
  # Run 30676585363 built both databases and then failed uploading its results,
  # because the API rejects the upload with "Code scanning is not enabled for
  # this repository". Restore the push and schedule triggers below once it is;
  # `TASKS.md` carries that step.
  #
  # push:
  #   branches:
  #     - main
  # schedule:
  #   # A push here has never created a check suite, so the schedule is what
  #   # would guarantee the analysis actually runs.
  #   - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Only the languages CodeQL supports that this repository contains. Its
        # shell and PowerShell installers are not analysable by CodeQL, so they
        # rely on ShellCheck and PSScriptAnalyzer in the validation workflow.
        language:
          - python
          - javascript-typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: /language:${{ matrix.language }}
